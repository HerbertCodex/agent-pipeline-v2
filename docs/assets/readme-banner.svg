<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title description">
  <title id="title">Agent Pipeline V2 — Du besoin au code vérifié</title>
  <desc id="description">Une pipeline locale : cadrer, construire, vérifier. Illustration des étapes reliées, dans les tons crème et cuivre du tableau de bord.</desc>
