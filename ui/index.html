<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Pipeline — tableau de bord</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">Agent Pipeline</span>
      <span class="brand__sub">tableau de bord</span>
    </div>
    <div class="top__actions">
      <span id="live" class="live" role="status" aria-live="polite">Connexion…</span>
      <button type="button" id="open-jobs" class="btn btn--ghost">Opérations <span id="jobs-count" class="count" hidden></span></button>
      <button type="button" id="open-maintenance" class="btn btn--ghost">Maintenance</button>
      <button type="button" id="open-new" class="btn btn--primary">Nouvelle spec</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="Specs">
      <div class="sidebar__tools">
        <div class="segmented" role="group" aria-label="Filtre">
          <button type="button" data-filter="active" aria-pressed="true">Actives</button>
          <button type="button" data-filter="all" aria-pressed="false">Toutes</button>
        </div>
        <label class="visually-hidden" for="search">Rechercher une spec</label>
        <input id="search" type="search" placeholder="Rechercher…" autocomplete="off">
      </div>
      <nav id="spec-list" class="spec-list"></nav>
    </aside>
    <main id="main" class="main" tabindex="-1">
      <div class="empty">
        <p class="empty__title">Choisissez une spec</p>
        <p>Son avancement, ses tâches, la QA et l'activité des agents s'affichent ici, en direct.</p>
      </div>
    </main>
  </div>
  <div id="jobs-backdrop" class="backdrop" hidden></div>
  <aside id="jobs" class="drawer" hidden aria-label="Opérations lancées depuis le tableau de bord">
    <div class="drawer__head">
      <h2>Opérations</h2>
      <button type="button" class="btn btn--ghost" data-close-drawer>Fermer</button>
    </div>
    <div id="jobs-body" class="drawer__body"></div>
  </aside>
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title">
    <div class="dialog__inner">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <p id="dialog-error" class="notice notice--error" role="alert" hidden></p>
      <div class="dialog__actions">
        <button type="button" class="btn btn--ghost" id="dialog-cancel">Annuler</button>
        <button type="button" class="btn btn--primary" id="dialog-confirm">Confirmer</button>
      </div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
