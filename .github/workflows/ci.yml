name: V2 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '24']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Pinned commits: avoid mutable action tags in the trusted CI path.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run demo
      - run: npm run demo:lifecycle
      - run: npm run check:package
# Results must be checked on the exact published commit; local success is not a remote CI claim.
